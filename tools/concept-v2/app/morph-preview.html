    h1{margin:0;font-size:20px;font-weight:400;line-height:28px}
    p{max-width:340px;margin:0;color:#949ea6;font-size:14px;line-height:20px}
    button{min-width:152px;min-height:44px;padding:9px 18px;border:1px solid #1992ec;border-radius:10px;background:#0876d0;color:#fff;font:500 15px/24px Onest,Arial,sans-serif;cursor:pointer}
    button:hover{background:#1789e4}
    button:focus-visible{outline:2px solid #f2f4f5;outline-offset:3px}
    .note{font-size:12px;color:#737d85}
  </style>

          <use href="#body-source" transform="scale(2)"/>
          <use href="#dot-source" transform="scale(2)"/>

        <g id="plug-left" fill="#c84828" hidden><use href="#plug-1"/></g>
        <g id="plug-right" fill="#c84828" hidden><use href="#plug-2"/></g>

      <h1>Проверка морфинга</h1>
      <p>«А» превращается в разорванное соединение. Нажми ещё раз, чтобы увидеть обратный ход.</p>
      <button id="toggle" type="button">Показать разрыв</button>
      <p class="note">Отдельное превью · основной прелоадер не меняется</p>
    </div>
  </main>
  <script>
    const svg=document.querySelector('#mark');
    const aExact=document.querySelector('#a-exact');
    const plugLeft=document.querySelector('#plug-left');
    const plugRight=document.querySelector('#plug-right');
    const plugFragments=document.querySelector('#plug-fragments');
    const button=document.querySelector('#toggle');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    const duration=340;
    let progress=0;
    let frame=0;

    const smooth=(from,to,value)=>{
      const t=Math.max(0,Math.min(1,(value-from)/(to-from)));
      return t*t*(3-2*t);
    };
    function visible(node,opacity){
      node.toggleAttribute('hidden',opacity<=0);
      node.setAttribute('opacity',opacity.toFixed(3));
    }

    function draw(value){
      progress=Math.max(0,Math.min(1,value));
      const collapse=smooth(.12,.68,progress);
      const aOpacity=1-smooth(.48,.70,progress);
      const plugOpacity=1-aOpacity;
      const fragmentOpacity=smooth(.45,.88,progress);
      const color=[0,1,2].map((_,index)=>{
        const start=[242,244,245][index],end=[200,72,40][index];
        return Math.round(start+(end-start)*smooth(.16,.56,progress));
      });
      aExact.setAttribute('fill',`rgb(${color.join(',')})`);
      const scale=(1-.08*collapse).toFixed(3);
      aExact.setAttribute('transform',`translate(48 48) scale(${scale}) translate(-48 -48)`);
      const spread=1-smooth(.30,.84,progress);
      plugLeft.setAttribute('transform',`translate(${(8*spread).toFixed(2)} ${(-8*spread).toFixed(2)})`);
      plugRight.setAttribute('transform',`translate(${(-8*spread).toFixed(2)} ${(8*spread).toFixed(2)})`);
      visible(aExact,aOpacity);
      visible(plugLeft,plugOpacity);
      visible(plugRight,plugOpacity);
      visible(plugFragments,fragmentOpacity);
    }
    function animate(to){
      cancelAnimationFrame(frame);
      if(reduced.matches){draw(to);return;}
      const from=progress,start=performance.now();
      const tick=now=>{
        const fraction=Math.min(1,(now-start)/duration);
        draw(from+(to-from)*fraction);
        if(fraction<1)frame=requestAnimationFrame(tick);
      };
      frame=requestAnimationFrame(tick);
    }
    function updateLabel(){
      const broken=progress>=.5;
      button.textContent=broken?'Вернуть «А»':'Показать разрыв';
      svg.setAttribute('aria-label',broken?'Разорванное соединение':'Буква А');
    }
    button.addEventListener('click',()=>{
      const target=progress>=.5?0:1;
      animate(target);
      button.textContent=target?'Вернуть «А»':'Показать разрыв';
      svg.setAttribute('aria-label',target?'Разорванное соединение':'Буква А');
    });
    const params=new URLSearchParams(location.search);
    if(params.has('t')){
      const reverse=params.has('reverse');
      const seconds=Number(params.get('t'));
      draw(reverse?1-Math.min(1,Math.max(0,seconds*1000/duration)):Math.min(1,Math.max(0,seconds*1000/duration)));
      updateLabel();
    }else draw(0);
    window.__ready=true;
  </script>
